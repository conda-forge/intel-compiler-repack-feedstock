conda_forge_output_validation: true
conda_build_tool: conda-build
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  pkg_format: '2'
workflow_settings:
  pagefile_size:
    - os: win
      value: 16
  build_workspace_dir:
    - provider: azure
      os: win
      value: C:\\bld\\
  tools_install_dir:
    - provider: azure
      os: win
      value: C:\Miniforge
